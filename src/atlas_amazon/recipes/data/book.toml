# book: KDP (ebook and print) metadata. Only KDP Help sources apply here.
# The Seller Central product title requirements exempt media product types
# (ABIS_BOOK, ABIS_EBOOKS), so none of them are inherited.

id = "book"
extends = "amazon-base"
version = "0.2.0"
description = "Books published through KDP (ebook and print)."

# --- Sources -----------------------------------------------------------------

[sources.kdp-metadata-guidelines]
title = "KDP Help: Metadata Guidelines for Books"
url = "https://kdp.amazon.com/en_US/help/topic/G201097560"
as_of = 2026-10-03
status = "verified"
scope = "KDP ebooks and print books (en_US help)."
note = "'Your title and subtitle together must be fewer than 200 characters' (so 199 is the maximum). Lists items prohibited in titles and keywords. Print titles must match the cover."

[sources.kdp-description]
title = "KDP Help: Write a Book Description"
url = "https://kdp.amazon.com/en_US/help/topic/G201189630"
as_of = 2026-10-03
status = "verified"
scope = "KDP ebooks and print books (en_US help)."
note = "'We have a limit of 4000 characters for the description.' HTML tags count towards the limit."

[sources.kdp-keywords]
title = "KDP Help: Make Your Book More Discoverable with Keywords"
url = "https://kdp.amazon.com/en_US/help/topic/G201298500"
as_of = 2026-10-03
status = "verified"
scope = "KDP ebooks and print books (en_US help)."
note = "'Use up to seven keywords or short phrases.' 'Keywords to avoid' is framed as guidance ('avoid'), except misleading metadata, which is zero-tolerance."

[sources.kdp-keyword-box-length-unconfirmed]
title = "KDP keyword box character limit (not stated in KDP Help)"
as_of = 2026-10-03
status = "unverified"
scope = "KDP keyword fields."
note = "The KDP keywords page only says 'keep an eye on the character limit in the text field' and gives no number. 50 characters per box is widely reported from the KDP form itself, but no official page states it."
see_also = [
  "https://kindlepreneur.com/7-kindle-keywords/",
  "https://reedsy.com/blog/guide/kdp/amazon-keywords/",
]

[sources.sc-media-product-types]
title = "Seller Central Help: Media product types (exempt from product title requirements)"
url = "https://sellercentral.amazon.com/help/hub/reference/external/GMF8CVX6S6CF8MM2"
as_of = 2026-10-03
status = "verified"
marketplace = "US"
note = "Lists ABIS_BOOK and ABIS_EBOOKS. This is why the book recipe carries no Seller Central title rules."

# --- Fields ------------------------------------------------------------------

[fields.subtitle]
kind = "text"
description = "No standalone limit is documented; see rules.title_subtitle_length."

[fields.description]
max_chars = 4000
source = "kdp-description"

[fields.keywords]
kind = "list"
max_count = 7
item_max_chars = 50
source = "kdp-keywords"
limit_sources = { item_max_chars = "kdp-keyword-box-length-unconfirmed" }
description = "KDP keyword boxes (backend)."

[backend]
field = "keywords"
mode = "slots"
source = "kdp-keywords"
# KDP Keywords "to avoid": information already covered elsewhere in the metadata.
visible_fields = ["title", "subtitle"]

# --- Title / subtitle rules (kdp-metadata-guidelines) --------------------------

[rules.title_subtitle_length]
check = "combined_length"
fields = ["title", "subtitle"]
max_chars = 199
severity = "error"
source = "kdp-metadata-guidelines"
description = "Combined length must be fewer than 200 characters."

[rules.title_promotional_references]
check = "prohibited_terms"
fields = ["title", "subtitle"]
terms = ["bestselling", "free"]
severity = "warning"
source = "kdp-metadata-guidelines"
description = "Sales-rank and promotion references are prohibited, but a word like 'free' can be part of a genuine title, so a human must confirm (warning)."

[rules.title_html_tags]
check = "disallowed_characters"
fields = ["title", "subtitle"]
characters = "<>"
severity = "error"
source = "kdp-metadata-guidelines"
description = "HTML tags are prohibited. Angle brackets are used as a deterministic proxy."

# --- Keyword rules ----------------------------------------------------------

[rules.keyword_promotional_references]
check = "prohibited_terms"
fields = ["keywords"]
terms = ["bestselling", "free"]
severity = "error"
source = "kdp-metadata-guidelines"
description = "Prohibited as keywords. Other authors' names and books need entity checks (LLM/human)."

[rules.keyword_html_tags]
check = "disallowed_characters"
fields = ["keywords"]
characters = "<>"
severity = "error"
source = "kdp-metadata-guidelines"

[rules.keyword_avoid_terms]
check = "prohibited_terms"
fields = ["keywords"]
terms = ["new", "on sale", "available now", "kindle unlimited", "kdp select", "book"]
severity = "warning"
source = "kdp-keywords"
description = "Examples from 'Keywords to avoid': time-sensitive statements, Amazon program names, and information common to most items. Framed as guidance, so a warning."

[rules.keyword_quotation_marks]
check = "disallowed_characters"
fields = ["keywords"]
characters = "\"“”"
severity = "warning"
source = "kdp-keywords"

# --- Scoring / research --------------------------------------------------------

[scoring.keyword]
relevance = 0.40
demand = 0.20
competition = 0.20
intent = 0.10
competitor_coverage = 0.10

[scoring.coverage]
title = 1.0
subtitle = 0.8
keywords = 0.4
description = 0.2

[research]
priorities = [
  "comparable_titles",
  "reader_review_themes",
  "browse_categories",
  "search_term_demand",
  "series_and_format_signals",
]
