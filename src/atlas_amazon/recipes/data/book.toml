# book: KDP / Amazon Books metadata. There are no bullets. Discoverability
# rests on title, subtitle, description, seven keyword boxes and categories.

id = "book"
extends = "amazon-base"
version = "0.1.0"
description = "Books published through KDP (ebook and print)."

[sources.kdp-metadata-guidelines]
title = "KDP Help: metadata guidelines for books"
as_of = 2024-01-01
status = "unverified"
note = "Title + subtitle combined under 200 characters. The title must match the cover. Description up to 4000 characters."

[sources.kdp-keywords-guidance]
title = "KDP Help: make your book more discoverable with keywords"
as_of = 2024-01-01
status = "unverified"
note = "Seven keyword boxes, 50 characters each. No other authors' names, Amazon program names, or time-sensitive or promotional claims."

[fields.subtitle]
kind = "text"
max_chars = 200
source = "kdp-metadata-guidelines"

[fields.description]
max_chars = 4000
source = "kdp-metadata-guidelines"

[fields.keywords]
kind = "list"
max_count = 7
item_max_chars = 50
source = "kdp-keywords-guidance"
description = "KDP backend keyword boxes."

[backend]
field = "keywords"
mode = "slots"
source = "kdp-keywords-guidance"

[rules.title_subtitle_length]
check = "combined_length"
fields = ["title", "subtitle"]
max_chars = 200
severity = "error"
source = "kdp-metadata-guidelines"

# A book title must match the cover exactly, so these marketplace title rules
# don't apply. Promotional terms still do.
[rules.title_word_repetition]
enabled = false

[rules.title_disallowed_characters]
enabled = false

[rules.promotional_terms]
fields = ["title", "subtitle"]

[rules.kdp_keyword_terms]
check = "prohibited_terms"
fields = ["keywords"]
terms = [
  "free",
  "bestselling",
  "best seller",
  "bestseller",
  "on sale",
  "new release",
  "available now",
  "kindle unlimited",
  "kdp select",
]
severity = "error"
source = "kdp-keywords-guidance"
description = "Other authors' names are also prohibited. That needs entity judgment, so it's left to LLM/human review."

[scoring.keyword]
relevance = 0.40
demand = 0.20
competition = 0.20
intent = 0.10
competitor_coverage = 0.10

[scoring.coverage]
title = 1.0
subtitle = 0.8
keywords = 0.4
description = 0.2

[research]
priorities = [
  "comparable_titles",
  "reader_review_themes",
  "browse_categories",
  "search_term_demand",
  "series_and_format_signals",
]
