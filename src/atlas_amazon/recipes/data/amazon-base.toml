# amazon-base: rules that apply to every Amazon detail page, whatever the category.
#
# PROVENANCE POLICY: every limit and rule cites a [sources.*] entry with an
# `as_of` date and a `status`. "unverified" means the rule is attributed to an
# Amazon source but nobody has re-checked it against that source on `as_of`.
# Re-verify before relying on it, then set status = "verified" and bump as_of.

id = "amazon-base"
version = "0.1.0"
description = "Marketplace-wide listing rules shared by every Amazon recipe."

[sources.amazon-title-policy-2025]
title = "Amazon Seller Central: product title requirements (policy update announced Jan 2025)"
as_of = 2025-01-21
status = "unverified"
marketplace = "US"
note = "Recalled from public announcements, not re-fetched. Category style guides may set lower limits."

[sources.amazon-description-guidance]
title = "Amazon Seller Central: product description field guidance"
as_of = 2024-01-01
status = "unverified"
marketplace = "US"
note = "Widely cited 2000-character description limit; varies by category template."

[sources.atlas-heuristic]
title = "atlas-amazon editorial heuristic"
as_of = 2026-10-03
status = "heuristic"
note = "A conservative project default, not an Amazon rule."

[fields.title]
kind = "text"
required = true
max_chars = 200
source = "amazon-title-policy-2025"

[fields.description]
kind = "text"
max_chars = 2000
source = "amazon-description-guidance"

[rules.title_word_repetition]
check = "word_repetition"
fields = ["title"]
max_repeats = 2
exempt = ["a", "an", "and", "as", "at", "by", "for", "from", "in", "of", "on", "or", "the", "to", "with"]
severity = "error"
source = "amazon-title-policy-2025"
description = "The same word may not appear more than twice (articles, prepositions and conjunctions are exempt)."

[rules.title_disallowed_characters]
check = "disallowed_characters"
fields = ["title"]
characters = "!$?_{}^¬¦"
severity = "error"
source = "amazon-title-policy-2025"
description = "Special characters used decoratively. A human must confirm any brand-name exception."

[rules.promotional_terms]
check = "prohibited_terms"
fields = ["title"]
terms = [
  "best seller",
  "bestseller",
  "free shipping",
  "hot sale",
  "on sale",
  "limited time",
  "money back guarantee",
  "top rated",
]
severity = "error"
source = "amazon-title-policy-2025"
description = "Promotional or subjective claims. The term list is curated by atlas and not exhaustive."

[scoring.keyword]
# Signals are each normalized to [0, 1]. Competition is inverted (1 - c) when scored.
relevance = 0.35
demand = 0.25
competition = 0.15
intent = 0.15
competitor_coverage = 0.10

[scoring.coverage]
# Relative field importance for placement scoring (normalized by the max weight).
title = 1.0
description = 0.2

[research]
priorities = ["competitor_titles", "search_term_demand", "review_themes"]
