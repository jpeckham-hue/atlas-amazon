# amazon-base: only what is genuinely shared by every Amazon recipe.
#
# This recipe deliberately sets NO limits and NO compliance rules. Seller
# Central product rules and KDP book rules are documented separately and
# differ. For example, the Seller Central title requirements explicitly
# exempt media product types (ABIS_BOOK, ABIS_EBOOKS). Each child recipe
# cites its own sources.
#
# PROVENANCE POLICY (enforced by the loader):
#   verified   = checked on `as_of` against an official Amazon policy page at `url`
#   unverified = attributed but not confirmable from official docs; `note` says why
#   heuristic  = a project convention, not an Amazon rule
# Third-party or forum references go in `see_also` and never justify `verified`.

id = "amazon-base"
version = "0.2.0"
description = "Shared field vocabulary and default weights for every Amazon recipe."

[sources.atlas-heuristic]
title = "atlas-amazon editorial heuristic"
as_of = 2026-10-03
status = "heuristic"
note = "A project default, not an Amazon rule."

[fields.title]
kind = "text"
required = true

[fields.description]
kind = "text"

[scoring.keyword]
# Each signal is normalized to [0, 1]. Competition is inverted (1 - c) when scored.
relevance = 0.35
demand = 0.25
competition = 0.15
intent = 0.15
competitor_coverage = 0.10

[scoring.coverage]
# Relative field importance for placement scoring (normalized by the max weight).
title = 1.0
description = 0.2

[research]
priorities = ["competitor_titles", "search_term_demand", "review_themes"]
